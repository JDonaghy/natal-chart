name: Deploy to GitHub Pages

# GitHub Pages is no longer where the app lives -- production moved to
# Cloudflare Pages (JDonaghy/coord-portal#107) so PRs can get their own UAT
# preview URLs, which GitHub Pages can't do. This workflow now just publishes
# a redirect stub, so old bookmarks/links to the .github.io URL still land
# somewhere useful instead of going dark or serving a stale build.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

env:
  CLOUDFLARE_PAGES_URL: https://natal-chart-3ew.pages.dev/

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Build redirect page
        run: |
          mkdir -p dist
          cat > dist/index.html <<HTML
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8">
              <title>Natal Chart</title>
              <link rel="canonical" href="${CLOUDFLARE_PAGES_URL}">
              <meta http-equiv="refresh" content="0; url=${CLOUDFLARE_PAGES_URL}">
              <script>location.replace('${CLOUDFLARE_PAGES_URL}');</script>
            </head>
            <body>
              <p>Natal Chart has moved. If you are not redirected, <a href="${CLOUDFLARE_PAGES_URL}">click here</a>.</p>
            </body>
          </html>
          HTML

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
